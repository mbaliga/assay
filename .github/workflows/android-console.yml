name: Android console
on:
  push:
    branches: [main, 'agent/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # android-console now pulls hyle-design-system in via git submodule (D-A sharing
          # mechanism); without this the includeBuild directory is empty and the composite
          # build fails immediately.
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Pinned to hyle-design-system's own gradle-wrapper.properties floor (8.14.3), the
          # minimum Gradle version its pinned AGP (8.9.1) requires. Was 9.5.0 — that version was
          # never verified against AGP 8.9.1 and the D-Q note in this constellation's shared
          # context warns AGP/Gradle mismatches have broken composite builds here three times
          # already. Re-check hyle-design-system/gradle/wrapper/gradle-wrapper.properties before
          # changing this.
          gradle-version: '8.14.3'
      - name: Build debug APK
        run: gradle -p android-console :app:assembleDebug --no-daemon
      - name: Lint debug APK
        run: gradle -p android-console :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assay-android-console-debug
          if-no-files-found: error
          path: |
            android-console/app/build/outputs/apk/debug/*.apk
            android-console/app/build/reports/lint-results-debug.*
