name: bootstrap-v1
on:
  push:
    branches: [agent/assay-v1-foundation]
    paths: ['.bootstrap/part08', '.github/workflows/bootstrap-v1.yml']
permissions:
  contents: write
jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/assay-v1-foundation
          fetch-depth: 0
      - name: Expand verified source payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/part08 > /tmp/assay-v1.tar.gz
          echo '92f6ab2c320b92d2ed5e3058681c5baab84ce57091f48681580920d9790c8461  /tmp/assay-v1.tar.gz' | sha256sum -c -
          mkdir /tmp/assay-v1
          tar -xzf /tmp/assay-v1.tar.gz -C /tmp/assay-v1
          rsync -a --delete --exclude '.git' /tmp/assay-v1/ ./
          rm -rf .bootstrap .github/workflows/bootstrap-v1.yml
      - name: Commit expanded v1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Assay v1 release candidate'
          git push origin HEAD:agent/assay-v1-foundation
