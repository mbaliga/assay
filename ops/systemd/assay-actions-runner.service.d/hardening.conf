[Unit]
Requires=assay-runner-preflight.service
After=assay-runner-preflight.service

[Service]
User=assay
Group=assay
UMask=0077
Environment=HOME=/var/lib/assay/home
Environment=ASSAY_WORK_ROOT=/var/lib/assay/work
WorkingDirectory=/opt/actions-runner
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=full
ProtectHome=yes
ReadWritePaths=/opt/actions-runner/_work /var/lib/assay
CapabilityBoundingSet=
AmbientCapabilities=
LockPersonality=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectClock=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
TasksMax=2048
LimitNOFILE=65536
TimeoutStopSec=120
KillMode=mixed
